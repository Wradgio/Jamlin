name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Upload fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: jamlin-jar-with-dependencies
          path: target/jamlin-jar-with-dependencies.jar
